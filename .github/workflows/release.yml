name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  attestations: write
  artifact-metadata: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Require a mainline release tag
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test tagged source
        run: |
          go test ./...
          cd contract
          go test ./...

      - name: Build release archives and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive="zeist-pki_${TAG}_${goos}_${goarch}.tar.gz"
            stage="dist/zeist-pki_${TAG}_${goos}_${goarch}"

            mkdir -p "${stage}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -buildvcs=true -ldflags="-s -w" \
              -o "${stage}/zeist-pki" ./cmd/zeist-pki
            cp LICENSE "${stage}/LICENSE"
            tar --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH:-0}" \
              -C "${stage}" -czf "dist/${archive}" zeist-pki LICENSE
            rm -rf "${stage}"
          done
          (
            cd dist
            sha256sum zeist-pki_*.tar.gz > "zeist-pki_${TAG}_checksums.txt"
          )

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/zeist-pki_${{ github.ref_name }}_source.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push OCI image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: dist/zeist-pki_${{ github.ref_name }}_image.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keylessly sign release files
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz dist/*.spdx.json dist/*_checksums.txt; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done

      - name: Keylessly sign OCI image
        run: cosign sign --yes "${IMAGE}@${{ steps.image.outputs.digest }}"

      - name: Attest release archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/zeist-pki_*.tar.gz

      - name: Attest OCI image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*_checksums.txt
            dist/*.spdx.json
            dist/*.sigstore.json
