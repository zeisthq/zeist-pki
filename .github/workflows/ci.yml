name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module metadata
        run: |
          go mod verify
          cd contract
          go mod verify

      - name: Vet
        run: |
          go vet ./...
          cd contract
          go vet ./...

      - name: Test
        run: |
          go test -race ./...
          cd contract
          go test -race ./...

      - name: Exercise documented examples
        run: |
          go run ./examples/generic
          go run ./cmd/zeist-pki plan --offline --config examples/kubernetes/pki.yaml

  envtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Kubernetes 1.36 envtest assets
        run: |
          echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.0 use -p path 1.36.2)" >> "$GITHUB_ENV"

      - name: Run envtest integration coverage
        run: go test -race -tags=envtest ./integration/kubernetes
