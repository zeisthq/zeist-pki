apiVersion: pki.zeist.io/v1alpha1
namespace: zeist-engine-system
acknowledgementNamespace: zeist-pki-acknowledgements

webhook:
  service: zeist-engine-webhook-service
  secret: zeist-engine-webhook-server-cert
  # This dedicated endpoint is used only to prove a candidate root through
  # Kubernetes admission before the production webhook leaf changes.
  canaryService: zeist-engine-webhook-rotation-canary
  canarySecret: zeist-engine-webhook-rotation-canary-cert
  canaryConfiguration: zeist-engine-pki-rotation-canary
  # For HA control planes, list every individual HTTPS API-server origin.
  # apiServerEndpoints:
  # - https://api-server-1.example.internal:6443
  # - https://api-server-2.example.internal:6443

mtls:
  serverSecret: zeistd-server-tls
  clientSecret: zeistd-controller-client-tls
  nodeSelector:
    zeist.io/firecracker-capable: "true"
  port: 10443

# Optional lifecycle-policy override for both built-in domains:
# policy:
#   rootValidity: 8760h
#   rootRolloverBefore: 2160h
#   leafValidity: 2160h
#   leafRenewBefore: 720h
#   minimumTrustOverlap: 720h
#   clockSkew: 5m
